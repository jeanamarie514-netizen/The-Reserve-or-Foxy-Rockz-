<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Reserve</title>
<link rel="icon" href="data:,">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Courier+Prime&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap');

:root{
  --stage:#16151a;
  --case:#1f1e24;
  --case2:#26252c;
  --line:#39373f;
  --paper:#f2ede1;
  --ink:#221f1a;
  --ink2:#5a5448;
  --brass:#b8935a;
  --brass-dim:#8a6d45;
  --text:#e7e3da;
  --text-dim:#9a968c;
  --danger:#a8564a;
}
*{box-sizing:border-box;}
html,body{background:var(--stage)!important;}
body{margin:0;color:var(--text);font-family:'Source Serif 4',serif;-webkit-font-smoothing:antialiased;padding-bottom:40px;}

/* ---------- header ---------- */
.rs-header{max-width:1080px;margin:0 auto;padding:44px 24px 28px;text-align:center;}
.rs-brand{display:flex;align-items:center;justify-content:center;gap:14px;}
.rs-brand img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
.rs-title{font-family:'Fraunces',serif;font-weight:500;font-size:2rem;letter-spacing:.01em;color:var(--text);margin:0;}
.rs-sub{font-family:'Source Serif 4',serif;font-style:italic;color:var(--text-dim);font-size:1.02rem;margin:10px 0 0;}
.rs-rule{width:64px;height:1px;background:var(--brass);margin:22px auto 0;}

/* ---------- toolbar ---------- */
.rs-toolbar{max-width:1080px;margin:28px auto 0;padding:0 24px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.rs-tabs{max-width:1080px;margin:18px auto 0;padding:0 24px;display:flex;gap:8px;border-bottom:1px solid var(--line);}
.rs-tab{background:none;border:none;color:var(--text-dim);font-family:'Fraunces',serif;font-weight:600;font-size:.88rem;padding:9px 4px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.rs-tab.active{color:var(--brass);border-bottom-color:var(--brass);}
.rs-search{flex:1;min-width:180px;background:var(--case);border:1px solid var(--line);color:var(--text);font-family:'Source Serif 4',serif;font-size:.95rem;padding:11px 14px;border-radius:2px;outline:none;}
.rs-search::placeholder{color:var(--text-dim);}
.rs-search:focus{border-color:var(--brass-dim);}
.rs-select{background:var(--case);border:1px solid var(--line);color:var(--text);font-family:'Source Serif 4',serif;font-size:.9rem;padding:11px 12px;border-radius:2px;outline:none;}
.rs-count{font-family:'Courier Prime',monospace;color:var(--text-dim);font-size:.78rem;letter-spacing:.03em;white-space:nowrap;}
.rs-add-btn{background:var(--brass);color:var(--stage);border:none;font-family:'Fraunces',serif;font-weight:600;font-size:.92rem;padding:11px 20px;border-radius:2px;cursor:pointer;white-space:nowrap;}
.rs-add-btn:active{background:var(--brass-dim);}

/* ---------- grid ---------- */
.rs-group-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
.rs-card{background:var(--case);border:1px solid var(--line);border-radius:2px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;}
.rs-card-stage{position:relative;width:100%;aspect-ratio:1;background:#0e0d11;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.rs-card-morerow{position:absolute;left:0;right:0;bottom:0;display:flex;gap:3px;padding:4px;background:linear-gradient(to top,rgba(8,7,9,.85),rgba(8,7,9,0));}
.rs-card-morerow img{width:30px;height:30px;object-fit:cover;border-radius:2px;border:1px solid rgba(231,227,218,.4);flex:none;}
.rs-card-morerow .rs-card-morecount{width:30px;height:30px;border-radius:2px;background:rgba(184,147,90,.9);color:var(--stage);font-family:'Courier Prime',monospace;font-size:.62rem;display:flex;align-items:center;justify-content:center;flex:none;}
.rs-card-stage img{width:100%;height:100%;object-fit:cover;}
.rs-card-stage .rs-card-morerow img{width:30px!important;height:30px!important;object-fit:cover!important;}
.rs-card-stage .rs-noimg{color:var(--text-dim);font-family:'Courier Prime',monospace;font-size:.7rem;letter-spacing:.05em;}
.rs-card-label{background:var(--paper);color:var(--ink);padding:12px 14px 13px;}
.rs-card-name{font-family:'Fraunces',serif;font-weight:600;font-size:.98rem;line-height:1.25;margin:0;}
.rs-card-loc{font-family:'Courier Prime',monospace;font-size:.68rem;color:var(--ink2);margin:5px 0 0;line-height:1.4;}

/* ---------- empty state ---------- */
.rs-empty{max-width:1080px;margin:60px auto;padding:0 24px;text-align:center;}
.rs-empty h3{font-family:'Fraunces',serif;font-weight:500;color:var(--text);font-size:1.3rem;margin:0 0 8px;}
.rs-empty p{color:var(--text-dim);font-style:italic;margin:0;}

/* ---------- modal shared ---------- */
.rs-modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(8,7,9,.82);backdrop-filter:blur(3px);align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px;}
.rs-modal.open{display:flex;}
.rs-modal-box{background:var(--stage);border:1px solid var(--line);max-width:640px;width:100%;border-radius:3px;animation:rsOpen .18s ease-out;}
@keyframes rsOpen{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:scale(1);}}

/* ---------- detail view ---------- */
.rs-detail-photos{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;background:#0e0d11;border-radius:3px 3px 0 0;overflow:hidden;}
.rs-detail-photos.single{grid-template-columns:1fr;}
.rs-detail-photos img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;display:block;}
.rs-lightbox{display:none;position:fixed;inset:0;z-index:200;background:rgba(8,7,9,.95);align-items:center;justify-content:center;padding:20px;}
.rs-lightbox.open{display:flex;}
.rs-lightbox img{max-width:100%;max-height:100%;object-fit:contain;}
.rs-lightbox-close{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(22,21,26,.8);color:var(--text);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.rs-detail-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(22,21,26,.8);color:var(--text);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.rs-label-card{background:var(--paper);color:var(--ink);padding:22px 26px 24px;border-radius:0 0 3px 3px;}
.rs-label-species{font-family:'Fraunces',serif;font-weight:600;font-size:1.4rem;margin:0;}
.rs-label-formula{font-family:'Courier Prime',monospace;font-size:.78rem;color:var(--ink2);margin:4px 0 0;}
.rs-label-rule{border:none;border-top:1px solid rgba(34,31,26,.25);margin:14px 0;}
.rs-label-row{font-family:'Courier Prime',monospace;font-size:.82rem;line-height:1.65;color:var(--ink);}
.rs-label-row b{font-weight:700;}
.rs-label-notes{font-family:'Source Serif 4',serif;font-style:italic;font-size:.9rem;color:var(--ink2);margin:14px 0 0;line-height:1.5;}
.rs-detail-actions{display:flex;gap:10px;padding:16px 26px 22px;background:var(--stage);border-radius:0 0 3px 3px;}
.rs-btn{font-family:'Fraunces',serif;font-weight:600;font-size:.85rem;padding:9px 16px;border-radius:2px;border:1px solid var(--line);background:var(--case);color:var(--text);cursor:pointer;}
.rs-btn.danger{color:var(--danger);border-color:rgba(168,86,74,.4);}
.rs-btn.brass{background:var(--brass);color:var(--stage);border-color:var(--brass);}
.rs-btn:disabled{opacity:.5;cursor:default;}

/* ---------- form ---------- */
.rs-form{padding:24px 26px 26px;}
.rs-form h2{font-family:'Fraunces',serif;font-weight:500;color:var(--text);font-size:1.3rem;margin:0 0 20px;}
.rs-field{margin-bottom:14px;}
.rs-field label{display:block;font-family:'Courier Prime',monospace;font-size:.68rem;letter-spacing:.06em;color:var(--text-dim);margin-bottom:6px;}
.rs-field input[type=text],.rs-field input[type=number],.rs-field textarea{width:100%;background:var(--case2);border:1px solid var(--line);color:var(--text);font-family:'Source Serif 4',serif;font-size:.92rem;padding:9px 11px;border-radius:2px;outline:none;}
.rs-field input:focus,.rs-field textarea:focus{border-color:var(--brass-dim);}
.rs-field textarea{min-height:64px;resize:vertical;}
.rs-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.rs-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:480px){.rs-row3{grid-template-columns:1fr;}.rs-row2{grid-template-columns:1fr;}}
.rs-photo-input{display:none;}
.rs-photo-btn{display:block;width:100%;text-align:center;border:1px dashed var(--line);border-radius:2px;padding:16px;color:var(--text-dim);font-family:'Courier Prime',monospace;font-size:.75rem;cursor:pointer;}
#f-purch-search{width:100%;background:var(--case2);border:1px solid var(--line);color:var(--text);font-family:'Source Serif 4',serif;font-size:.92rem;padding:9px 11px;border-radius:2px;outline:none;}
#f-purch-search:focus{border-color:var(--brass-dim);}
.rs-purch-result{padding:9px 10px;border:1px solid var(--line);border-top:none;background:var(--case2);cursor:pointer;font-size:.82rem;}
.rs-purch-result:first-of-type{border-top:1px solid var(--line);border-radius:2px 2px 0 0;}
.rs-purch-result:last-of-type{border-radius:0 0 2px 2px;}
.rs-purch-result:hover{background:var(--case);}
.rs-purch-result .rn{color:var(--text);}
.rs-purch-result .rd{color:var(--text-dim);font-family:'Courier Prime',monospace;font-size:.7rem;margin-top:2px;}
.rs-purch-status{font-family:'Courier Prime',monospace;font-size:.7rem;color:var(--text-dim);margin-top:6px;font-style:italic;}
.rs-photo-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.rs-photo-thumb{position:relative;width:74px;height:74px;border-radius:2px;overflow:hidden;background:#0e0d11;}
.rs-photo-thumb img{width:100%;height:100%;object-fit:cover;}
.rs-photo-thumb .rs-photo-cover-tag{position:absolute;bottom:0;left:0;right:0;background:rgba(184,147,90,.9);color:var(--stage);font-family:'Courier Prime',monospace;font-size:.55rem;text-align:center;padding:1px 0;}
.rs-photo-thumb .rs-photo-remove{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(8,7,9,.75);color:#e7e3da;border:none;font-size:.7rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}

#rs-grid{margin-top:20px;}
.rs-group{max-width:1080px;margin:0 auto;padding:0 24px;}
.rs-group-header{display:flex;align-items:baseline;gap:14px;margin:36px 0 16px;}
.rs-group-header:first-child{margin-top:0;}
.rs-group-name{font-family:'Fraunces',serif;font-weight:500;font-size:1.15rem;color:var(--text);white-space:nowrap;}
.rs-group-line{flex:1;height:1px;background:var(--line);}
.rs-group-count{font-family:'Courier Prime',monospace;font-size:.7rem;color:var(--text-dim);white-space:nowrap;}

/* ---------- detail filmstrip ---------- */

.rs-form-acts{display:flex;gap:10px;margin-top:20px;}
.rs-err{color:var(--danger);font-family:'Courier Prime',monospace;font-size:.78rem;margin-top:10px;min-height:1em;}

/* ---------- toast ---------- */
#rs-flash{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--brass);color:var(--stage);font-family:'Fraunces',serif;font-weight:600;font-size:.85rem;padding:10px 20px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:200;}
#rs-flash.show{opacity:1;}
</style>
</head>

<div class="rs-toolbar">
  <input type="text" id="rs-search" class="rs-search" placeholder="Search by species, locality, or dealer&hellip;">

    <option value="added">Recently added</option>

</div>

<div class="rs-tabs" id="rs-tabs">
  <button class="rs-tab active" data-tab="all">All</button>
  <button class="rs-tab" data-tab="sphere">Spheres</button>
  <button class="rs-tab" data-tab="tower">Towers</button>
</div>
<div id="rs-grid"></div>

<!-- Detail modal -->
<div class="rs-modal" id="rs-detail-modal">
  <div class="rs-modal-box" style="position:relative;">
    <button class="rs-detail-close" id="rs-detail-close">&times;</button>
    <div class="rs-detail-photos" id="rs-detail-photos"></div>
    <div class="rs-label-card">
      <p class="rs-label-species" id="rs-detail-species"></p>
      <p class="rs-label-formula" id="rs-detail-formula"></p>
      <hr class="rs-label-rule">
      <div class="rs-label-row" id="rs-detail-locality"></div>
      <hr class="rs-label-rule">
      <div class="rs-label-row" id="rs-detail-meta"></div>
      <p class="rs-label-notes" id="rs-detail-notes"></p>
    </div>
    <div class="rs-detail-actions">
      <button class="rs-btn brass" id="rs-detail-edit">Edit</button>
      <button class="rs-btn danger" id="rs-detail-del">Delete</button>
    </div>
  </div>
</div>

<!-- Cover photo reposition modal -->
<div class="rs-modal" id="rs-position-modal" style="z-index:150;">
  <div class="rs-modal-box" style="max-width:420px;">
    <div class="rs-form">
      <h2>Adjust Cover Photo Position</h2>
      <p style="font-family:'Source Serif 4',serif;font-size:.82rem;color:var(--text-dim);margin:-8px 0 14px;">Tap where the card thumbnail should center on.</p>
      <div id="rs-position-frame" style="position:relative;width:100%;aspect-ratio:1;background:#0e0d11;overflow:hidden;border-radius:2px;cursor:crosshair;">
        <img id="rs-position-img" style="width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;">
        <div id="rs-position-marker" style="position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid var(--brass);background:rgba(184,147,90,.35);transform:translate(-50%,-50%);pointer-events:none;"></div>
      </div>
      <div id="rs-position-preview-wrap" style="margin-top:14px;">
        <label style="display:block;font-family:'Courier Prime',monospace;font-size:.68rem;letter-spacing:.06em;color:var(--text-dim);margin-bottom:6px;">Card preview</label>
        <div style="width:120px;aspect-ratio:1;background:#0e0d11;border-radius:2px;overflow:hidden;">
          <img id="rs-position-preview-img" style="width:100%;height:100%;object-fit:cover;display:block;">
        </div>
      </div>
      <div class="rs-form-acts">
        <button class="rs-btn" id="rs-position-reset">Reset to Center</button>
        <button class="rs-btn brass" id="rs-position-done">Done</button>
      </div>
    </div>
  </div>
</div>

<!-- Lightbox (full-size single photo view) -->
<div class="rs-lightbox" id="rs-lightbox">
  <button class="rs-lightbox-close" id="rs-lightbox-close">&times;</button>
  <img id="rs-lightbox-img" alt="">
</div>

<!-- Add/Edit modal -->
<div class="rs-modal" id="rs-form-modal">
  <div class="rs-modal-box">
    <div class="rs-form">
      <h2 id="rs-form-title">Add Specimen</h2>

      <div class="rs-field">
        <label>Match a Purchase (optional)</label>
        <input type="text" id="f-purch-search" placeholder="e.g. aquamarine, tourmaline...">
        <div id="f-purch-results"></div>
        <div id="f-purch-status" class="rs-purch-status"></div>
      </div>
      <div class="rs-field"><label>Name</label><input type="text" id="f-name" placeholder="e.g. Tanzanite Crystal"></div>
      <div class="rs-row2">
        <div class="rs-field"><label>Species</label><input type="text" id="f-species" placeholder="e.g. Zoisite (var. Tanzanite)"></div>
        <div class="rs-field"><label>Formula</label><input type="text" id="f-formula" placeholder="e.g. Ca2Al3(SiO4)3(OH)"></div>
      </div>

      <div class="rs-row3">
        <div class="rs-field"><label>Mine / Locality</label><input type="text" id="f-mine" placeholder="e.g. Merelani Hills"></div>
        <div class="rs-field"><label>Region / State</label><input type="text" id="f-region" placeholder="e.g. Manyara Region"></div>
        <div class="rs-field"><label>Country</label><input type="text" id="f-country" placeholder="e.g. Tanzania"></div>
      </div>

      <div class="rs-row2">
        <div class="rs-field"><label>Dealer / Source</label><input type="text" id="f-dealer" placeholder="e.g. Yankee Minerals"></div>
        <div class="rs-field"><label>Ex-Collection</label><input type="text" id="f-excoll" placeholder="e.g. Ex. Joel Victor Collection"></div>
      </div>

      <div class="rs-row2">
        <div class="rs-field"><label>Form</label><input type="text" id="f-form" list="rs-form-list" placeholder="e.g. Sphere, Point, Cluster">
          <datalist id="rs-form-list">
            <option value="Sphere"></option>
            <option value="Point"></option>
            <option value="Tower"></option>
            <option value="Cluster"></option>
            <option value="Rough"></option>
            <option value="Cabochon"></option>
            <option value="Freeform"></option>

            <option value="Tumbled"></option>

        <div class="rs-field"><label>UV &mdash; Low (LW, 365nm)</label><input type="text" id="f-uv-low" placeholder="leave blank if not tested"></div>
        <div class="rs-field"><label>UV &mdash; Medium</label><input type="text" id="f-uv-med" placeholder="leave blank if not tested"></div>
        <div class="rs-field"><label>UV &mdash; High (SW, 254nm)</label><input type="text" id="f-uv-high" placeholder="leave blank if not tested"></div>

        <div class="rs-photo-strip" id="f-photo-strip"></div>

      </div>

      <div class="rs-err" id="f-err"></div>

        <button class="rs-btn" id="f-cancel">Cancel</button>
        <button class="rs-btn" id="f-skip" style="display:none;">Skip</button>
        <button class="rs-btn brass" id="f-save">Add to Reserve</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

var DB_NAME='TheReserve', DB_VER=1, db=null;
var specimens=[], editId=null;
var bulkQueue=[], bulkIndex=0, bulkActive=false, bulkSaved=0;
var pendingPhotoJobs=0;
var formPhotos=[];      // [{id: string|null, data: dataURL, isNew: bool}, ...] -- index 0 is cover
var formCoverPosition='50% 50%';
var originalPhotoIds=[]; // photoIds the specimen had when the edit form opened
var detailPhotos=[];    // photos currently shown in the open detail modal

function openDB(cb){
  var req=indexedDB.open(DB_NAME,DB_VER);
  req.onupgradeneeded=function(e){
    var d=e.target.result;
    if(!d.objectStoreNames.contains('specimens'))d.createObjectStore('specimens',{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});
  };
  req.onsuccess=function(e){db=e.target.result;cb();};
  req.onerror=function(){cb();};
}

function loadAll(cb){
  if(!db){cb();return;}
  try{
    var tx=db.transaction('specimens','readonly');
    var req=tx.objectStore('specimens').getAll();
    req.onsuccess=function(){specimens=req.result||[];cb();};
    req.onerror=function(){specimens=[];cb();};
  }catch(e){specimens=[];cb();}
}

function getPhoto(id,cb){
  if(id===null||id===undefined||!db){cb(null);return;}
  try{
    var tx=db.transaction('photos','readonly');
    var req=tx.objectStore('photos').get(id);
    req.onsuccess=function(){cb(req.result?req.result.data:null);};
    req.onerror=function(){cb(null);};
  }catch(e){cb(null);}
}

// fetch several photos in order, calling back once with an array of dataURLs
// (nulls skipped) once every lookup has settled
function getPhotos(ids,cb){
  if(!ids||!ids.length){cb([]);return;}
  var results=new Array(ids.length);
  var remaining=ids.length;
  ids.forEach(function(id,i){
    getPhoto(id,function(data){
      results[i]=data;
      remaining--;
      if(remaining===0)cb(results.filter(function(d){return !!d;}));
    });
  });
}

function savePhotoWithId(id,dataURL,cb){
  try{
    var tx=db.transaction('photos','readwrite');
    tx.objectStore('photos').put({id:id,data:dataURL});
    tx.oncomplete=function(){cb&&cb();};
    tx.onerror=function(){cb&&cb();};
  }catch(e){cb&&cb();}
}

function deletePhotosByIds(ids,cb){
  if(!ids||!ids.length){cb&&cb();return;}
  try{
    var tx=db.transaction('photos','readwrite');
    ids.forEach(function(id){tx.objectStore('photos').delete(id);});
    tx.oncomplete=function(){cb&&cb();};
    tx.onerror=function(){cb&&cb();};
  }catch(e){cb&&cb();}
}

function saveSpecimen(spec,cb){
  try{
    var tx=db.transaction('specimens','readwrite');
    var req=tx.objectStore('specimens').put(spec);
    req.onsuccess=function(){cb&&cb(req.result);};
    req.onerror=function(){cb&&cb(null);};
  }catch(e){cb&&cb(null);}
}

function deleteSpecimen(id,cb){
  var s=specimens.find(function(x){return x.id===id;});
  var photoIds=(s&&s.photoIds)||[];
  try{
    var tx=db.transaction(['specimens','photos'],'readwrite');
    tx.objectStore('specimens').delete(id);
    photoIds.forEach(function(pid){tx.objectStore('photos').delete(pid);});
    tx.oncomplete=function(){cb&&cb();};
    tx.onerror=function(){cb&&cb();};
  }catch(e){cb&&cb();}
}

// ---- image compression (mirrors the proven pattern: max 900px, q0.75) ----
function compressPhoto(file,cb){
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    var done=false;
    var finish=function(v){if(done)return;done=true;cb(v);};
    img.onload=function(){
      try{
        var MAX=900,q=0.75,w=img.width,h=img.height;
        if(!w||!h){finish(null);return;}
        if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;
        var ctx=cv.getContext('2d');
        if(!ctx){finish(null);return;}
        ctx.drawImage(img,0,0,w,h);
        finish(cv.toDataURL('image/jpeg',q));
      }catch(e){finish(null);}
    };
    img.onerror=function(){finish(ev.target.result);};
    setTimeout(function(){finish(ev.target.result);},8000);
    img.src=ev.target.result;
  };
  reader.onerror=function(){cb(null);};
  reader.readAsDataURL(file);
}

function flash(msg){
  var f=document.getElementById('rs-flash');
  f.textContent=msg||'Saved';
  f.classList.add('show');
  clearTimeout(flash._t);
  flash._t=setTimeout(function(){f.classList.remove('show');},1600);
}

function esc(s){
  return (s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
}

function localityLine(s){
  var parts=[s.mine,s.region,s.country].filter(Boolean);
  return parts.join(', ');
}

function groupKey(s){
  return (s.species||'').trim() || 'Uncategorized';
}

// ---------------- render grid (grouped by species/mineral type) ----------------
var currentTab='all';

function isSphere(s){
  if((s.form||'').toLowerCase().indexOf('sphere')>=0)return true;
  return (s.name||'').toLowerCase().indexOf('sphere')>=0;
}
function isTower(s){
  var form=(s.form||'').toLowerCase();
  if(form.indexOf('tower')>=0||form.indexOf('point')>=0)return true;
  var name=(s.name||'').toLowerCase();
  return name.indexOf('tower')>=0||name.indexOf('point')>=0;
}

function matchesTab(s){
  if(currentTab==='sphere')return isSphere(s);
  if(currentTab==='tower')return isTower(s);
  // 'all' = everything that isn't already claimed by a dedicated tab
  return !isSphere(s)&&!isTower(s);
}

function render(){
  var q=(document.getElementById('rs-search').value||'').trim().toLowerCase();
  var sort=document.getElementById('rs-sort').value;

  var list=specimens.filter(function(s){
    if(!matchesTab(s))return false;
    if(!q)return true;
    var hay=[s.name,s.species,s.form,s.mine,s.region,s.country,s.dealer,s.excoll].join(' ').toLowerCase();
    return hay.indexOf(q)>=0;
  });

  document.getElementById('rs-count').textContent=specimens.length+' specimen'+(specimens.length!==1?'s':'');
  var wrap=document.getElementById('rs-grid');
  var empty=document.getElementById('rs-empty');
  wrap.innerHTML='';
  if(!specimens.length){
    empty.style.display='block';
    empty.querySelector('h3').textContent='The case is empty';
    empty.querySelector('p').textContent='Add your first specimen to begin the catalogue.';
    return;
  }
  if(!list.length){
    empty.style.display='block';
    empty.querySelector('h3').textContent=q?'No matches':'Nothing here yet';
    empty.querySelector('p').textContent=q?'Try a different search term.':(currentTab==='sphere'?'No spheres in the collection yet.':currentTab==='tower'?'No towers in the collection yet.':'No specimens match this view.');
    return;
  }
  empty.style.display='none';

  // group by species/mineral type
  var groups={};
  list.forEach(function(s){
    var k=groupKey(s);
    (groups[k]=groups[k]||[]).push(s);
  });
  var groupNames=Object.keys(groups).sort(function(a,b){
    if(a==='Uncategorized')return 1;
    if(b==='Uncategorized')return -1;
    return a.localeCompare(b);
  });

  groupNames.forEach(function(gname){
    var items=groups[gname].slice();
    if(sort==='name')items.sort(function(a,b){return (a.name||a.species||'').localeCompare(b.name||b.species||'');});
    else items.sort(function(a,b){return (b.id||0)-(a.id||0);});

    var section=document.createElement('div');
    section.className='rs-group';
    section.innerHTML=
      '<div class="rs-group-header"><span class="rs-group-name">'+esc(gname)+'</span><span class="rs-group-line"></span>'+
      '<span class="rs-group-count">'+items.length+'</span></div>'+
      '<div class="rs-group-cards"></div>';
    var cardsEl=section.querySelector('.rs-group-cards');

    items.forEach(function(s){
      var card=document.createElement('div');
      card.className='rs-card';
      card.innerHTML=
        '<div class="rs-card-stage"><span class="rs-noimg">no photo</span></div>'+
        '<div class="rs-card-label">'+
          '<p class="rs-card-name">'+esc(s.name||s.species||'Untitled')+'</p>'+
          '<p class="rs-card-loc">'+esc(localityLine(s))+'</p>'+
        '</div>';
      card.onclick=function(){openDetail(s.id);};
      cardsEl.appendChild(card);
      var coverId=s.photoIds&&s.photoIds[0];
      var restIds=(s.photoIds||[]).slice(1);
      if(coverId){
        getPhoto(coverId,function(data){
          var stage=card.querySelector('.rs-card-stage');
          if(data)stage.innerHTML='<img src="'+data+'" alt="" style="object-position:'+esc(s.coverPosition||'50% 50%')+';">';
          if(restIds.length){
            var MAX_SHOWN=3;
            var shown=restIds.slice(0,MAX_SHOWN);
            var extra=restIds.length-shown.length;
            getPhotos(shown,function(thumbs){
              var row=document.createElement('div');
              row.className='rs-card-morerow';
              thumbs.forEach(function(t){row.innerHTML+='<img src="'+t+'" alt="">';});
              if(extra>0)row.innerHTML+='<span class="rs-card-morecount">+'+extra+'</span>';
              stage.appendChild(row);
            });
          }
        });
      }
    });

    wrap.appendChild(section);
  });
}

// ---------------- detail modal ----------------
function openDetail(id){
  var s=specimens.find(function(x){return x.id===id;});
  if(!s)return;
  document.getElementById('rs-detail-modal').dataset.id=id;
  document.getElementById('rs-detail-species').textContent=s.name||s.species||'Untitled';
  document.getElementById('rs-detail-formula').textContent=s.formula||'';
  document.getElementById('rs-detail-formula').style.display=s.formula?'block':'none';

  var locBits=[];
  if(s.mine)locBits.push('<b>'+esc(s.mine)+'</b>');
  if(s.region)locBits.push(esc(s.region));
  if(s.country)locBits.push(esc(s.country));
  document.getElementById('rs-detail-locality').innerHTML=locBits.length?locBits.join('<br>'):'<span style="opacity:.5">Locality not recorded</span>';

  var metaBits=[];
  if(s.dealer)metaBits.push(esc(s.dealer));
  if(s.excoll)metaBits.push(esc(s.excoll));
  if(s.form)metaBits.push(esc(s.form));
  if(s.dims)metaBits.push(esc(s.dims));
  var uvBits=[];
  if(s.uvLow)uvBits.push('LW '+esc(s.uvLow));
  if(s.uvMed)uvBits.push('MW '+esc(s.uvMed));
  if(s.uvHigh)uvBits.push('SW '+esc(s.uvHigh));
  if(uvBits.length)metaBits.push('UV: '+uvBits.join(' / '));
  document.getElementById('rs-detail-meta').innerHTML=metaBits.length?metaBits.join('<br>'):'<span style="opacity:.5">No further details</span>';

  document.getElementById('rs-detail-notes').textContent=s.notes||'';
  document.getElementById('rs-detail-notes').style.display=s.notes?'block':'none';

  var photosEl=document.getElementById('rs-detail-photos');
  photosEl.innerHTML='';
  detailPhotos=[];

  var photoIds=s.photoIds||[];
  getPhotos(photoIds,function(datas){
    detailPhotos=datas;
    photosEl.classList.toggle('single',datas.length<=1);
    datas.forEach(function(d){
      var img=document.createElement('img');
      img.src=d;
      img.alt='';
      img.onclick=function(){openLightbox(d);};
      photosEl.appendChild(img);
    });
  });

  document.getElementById('rs-detail-modal').classList.add('open');
}
function closeDetail(){document.getElementById('rs-detail-modal').classList.remove('open');}

function openLightbox(dataURL){
  document.getElementById('rs-lightbox-img').src=dataURL;
  document.getElementById('rs-lightbox').classList.add('open');
}
function closeLightbox(){document.getElementById('rs-lightbox').classList.remove('open');}

// ---------------- add/edit form ----------------
var FIELD_IDS=['f-name','f-species','f-formula','f-form','f-mine','f-region','f-country','f-dealer','f-excoll','f-dims','f-uv-low','f-uv-med','f-uv-high','f-notes'];

// ---------------- purchase-match (Line Items sheet) ----------------
var PURCH_CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vSOTWPZlNWNm_SLqhDH9d4-NEF4zBatjrNXiMmPkmybnh8rUnK5R2kjcSIxd_CLwDMj-Bvp_Z3HqW4y/pub?gid=306141163&single=true&output=csv';
var purchRows=null; // cached parsed rows, fetched once per session
var purchDebounce=null;

function parseCSVLine(line){
  var out=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(inQ){
      if(c==='"'){
        if(line[i+1]==='"'){cur+='"';i++;}else{inQ=false;}
      }else cur+=c;
    }else{
      if(c==='"')inQ=true;
      else if(c===','){out.push(cur);cur='';}
      else cur+=c;
    }
  }
  out.push(cur);
  return out;
}

function parsePurchaseCSV(text){
  // rows may contain newlines inside quoted fields -- split on real record
  // boundaries by tracking quote parity across lines
  var lines=text.split('\n');
  var records=[],buf='';
  lines.forEach(function(line){
    buf=buf?buf+'\n'+line:line;
    var quoteCount=(buf.match(/"/g)||[]).length;
    if(quoteCount%2===0){records.push(buf);buf='';}
  });
  if(buf)records.push(buf);
  // header is the SECOND line in this sheet (first line is a stray/duplicate header)
  var rows=records.slice(2).map(parseCSVLine).filter(function(r){return r.length>3 && r[3];});
  return rows.map(function(r){
    return {vendor:r[0]||'',invoice:r[1]||'',date:r[2]||'',item:r[3]||'',gemstone:r[8]||'',origin:r[9]||''};
  });
}

function ensurePurchRows(cb){
  if(purchRows){cb(purchRows);return;}
  var statusEl=document.getElementById('f-purch-status');
  if(statusEl)statusEl.textContent='Loading purchase list\u2026';
  fetch(PURCH_CSV_URL).then(function(res){return res.text();}).then(function(text){
    purchRows=parsePurchaseCSV(text);
    if(statusEl)statusEl.textContent='';
    cb(purchRows);
  }).catch(function(){
    if(statusEl)statusEl.textContent='Could not load purchase list (offline?).';
    cb([]);
  });
}

function renderPurchResults(matches,q){
  var el=document.getElementById('f-purch-results');
  el.innerHTML='';
  if(!q){return;}
  if(!matches.length){
    el.innerHTML='<div class="rs-purch-status" style="margin:6px 0 0;">No matches.</div>';
    return;
  }
  matches.slice(0,8).forEach(function(m){
    var row=document.createElement('div');
    row.className='rs-purch-result';
    row.innerHTML='<div class="rn">'+esc(m.item)+'</div><div class="rd">'+esc(m.vendor)+(m.origin?' \u2014 '+esc(m.origin):'')+'</div>';
    row.onclick=function(){
      var cleanName=m.item.replace(/,?\s*\([^)]*\)\s*$/,'').trim();
      document.getElementById('f-name').value=cleanName||m.item;
      document.getElementById('f-species').value=m.gemstone||'';
      document.getElementById('f-mine').value=m.origin||'';
      document.getElementById('f-dealer').value=m.vendor||'';
      document.getElementById('f-purch-search').value=m.item;
      el.innerHTML='';
      document.getElementById('f-purch-status').textContent='Filled from purchase record. Adjust locality/species as needed.';
    };
    el.appendChild(row);
  });
}

document.getElementById('f-purch-search').oninput=function(){
  var q=this.value.trim().toLowerCase();
  clearTimeout(purchDebounce);
  if(!q){document.getElementById('f-purch-results').innerHTML='';document.getElementById('f-purch-status').textContent='';return;}
  purchDebounce=setTimeout(function(){
    ensurePurchRows(function(rows){
      var matches=rows.filter(function(r){
        return (r.item+' '+r.gemstone+' '+r.origin+' '+r.vendor).toLowerCase().indexOf(q)>=0;
      });
      renderPurchResults(matches,q);
    });
  },300);
};


function updateSaveBusyState(){
  var btn=document.getElementById('f-save');
  if(pendingPhotoJobs>0){
    btn.disabled=true;
    btn.dataset.origLabel=btn.dataset.origLabel||btn.textContent;
    btn.textContent='Processing photos\u2026 ('+pendingPhotoJobs+' left)';
  }else{
    btn.disabled=false;
    if(btn.dataset.origLabel){btn.textContent=btn.dataset.origLabel;delete btn.dataset.origLabel;}
  }
}

function renderPhotoStrip(){
  var strip=document.getElementById('f-photo-strip');
  strip.innerHTML='';
  formPhotos.forEach(function(p,i){
    var t=document.createElement('div');
    t.className='rs-photo-thumb';
    t.innerHTML=
      '<img src="'+p.data+'" alt="">'+
      (i===0?'<span class="rs-photo-cover-tag">Cover</span>':'')+
      '<button type="button" class="rs-photo-remove" aria-label="Remove photo">&times;</button>';
    t.querySelector('.rs-photo-remove').onclick=function(){
      formPhotos.splice(i,1);
      if(i===0)formCoverPosition='50% 50%';
      renderPhotoStrip();
    };
    strip.appendChild(t);
  });
  document.getElementById('f-adjust-position').style.display=formPhotos.length?'block':'none';
}

function clearForm(){
  FIELD_IDS.forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('f-photo').value='';
  formPhotos=[];
  formCoverPosition='50% 50%';
  originalPhotoIds=[];
  pendingPhotoJobs=0;
  updateSaveBusyState();
  renderPhotoStrip();
  document.getElementById('f-err').textContent='';
  document.getElementById('f-purch-search').value='';
  document.getElementById('f-purch-results').innerHTML='';
  document.getElementById('f-purch-status').textContent='';
  document.getElementById('f-skip').style.display='none';
}

function openAddForm(){
  editId=null;clearForm();
  document.getElementById('rs-form-title').textContent='Add Specimen';
  document.getElementById('f-save').textContent='Add to Reserve';
  document.getElementById('rs-form-modal').classList.add('open');
}

// ---------------- bulk add ----------------
function openBulkStep(){
  if(bulkIndex>=bulkQueue.length){
    var n=bulkSaved;
    bulkActive=false;bulkQueue=[];bulkIndex=0;bulkSaved=0;
    closeForm();
    flash(n+' specimen'+(n!==1?'s':'')+' added');
    return;
  }
  editId=null;clearForm();
  document.getElementById('f-skip').style.display='inline-block';
  document.getElementById('rs-form-title').textContent='Bulk Add \u2014 Specimen '+(bulkIndex+1)+' of '+bulkQueue.length;
  document.getElementById('f-save').textContent=(bulkIndex===bulkQueue.length-1)?'Save & Finish':'Save & Continue';
  document.getElementById('rs-form-modal').classList.add('open');
  compressPhoto(bulkQueue[bulkIndex],function(dataURL){
    if(dataURL){
      formPhotos=[{id:null,data:dataURL,isNew:true}];
      renderPhotoStrip();
    }
  });
}

document.getElementById('rs-bulk-btn').onclick=function(){document.getElementById('rs-bulk-photo-input').click();};
document.getElementById('rs-bulk-photo-input').onchange=function(){
  var files=Array.prototype.slice.call(this.files);
  this.value='';
  if(!files.length)return;
  bulkQueue=files;bulkIndex=0;bulkActive=true;bulkSaved=0;
  openBulkStep();
};
document.getElementById('f-skip').onclick=function(){
  if(!bulkActive)return;
  bulkIndex++;
  openBulkStep();
};

function openEditForm(id){
  var s=specimens.find(function(x){return x.id===id;});
  if(!s)return;
  editId=id;
  document.getElementById('f-purch-search').value='';
  document.getElementById('f-purch-results').innerHTML='';
  document.getElementById('f-purch-status').textContent='';
  document.getElementById('f-skip').style.display='none';
  document.getElementById('rs-form-title').textContent='Edit Specimen';
  document.getElementById('f-save').textContent='Save Changes';
  document.getElementById('f-name').value=s.name||'';
  document.getElementById('f-species').value=s.species||'';
  document.getElementById('f-formula').value=s.formula||'';
  document.getElementById('f-form').value=s.form||'';
  document.getElementById('f-mine').value=s.mine||'';
  document.getElementById('f-region').value=s.region||'';
  document.getElementById('f-country').value=s.country||'';
  document.getElementById('f-dealer').value=s.dealer||'';
  document.getElementById('f-excoll').value=s.excoll||'';
  document.getElementById('f-dims').value=s.dims||'';
  document.getElementById('f-uv-low').value=s.uvLow||'';
  document.getElementById('f-uv-med').value=s.uvMed||'';
  document.getElementById('f-uv-high').value=s.uvHigh||'';
  document.getElementById('f-notes').value=s.notes||'';
  document.getElementById('f-err').textContent='';
  document.getElementById('f-photo').value='';

  originalPhotoIds=(s.photoIds||[]).slice();
  formPhotos=[];
  formCoverPosition=s.coverPosition||'50% 50%';
  getPhotos(originalPhotoIds,function(datas){
    formPhotos=originalPhotoIds.map(function(pid,i){return {id:pid,data:datas[i],isNew:false};}).filter(function(p){return !!p.data;});
    renderPhotoStrip();
  });

  document.getElementById('rs-form-modal').classList.add('open');
}

function closeForm(){
  document.getElementById('rs-form-modal').classList.remove('open');
  editId=null;
  bulkActive=false;bulkQueue=[];bulkIndex=0;
  document.getElementById('f-skip').style.display='none';
}

function afterSaveSuccess(isEdit){
  loadAll(function(){
    render();
    if(bulkActive){
      bulkSaved++;
      bulkIndex++;
      openBulkStep();
    }else{
      closeForm();
      flash(isEdit?'Changes saved':'Specimen added');
    }
  });
}

function trySave(){
  if(pendingPhotoJobs>0){document.getElementById('f-err').textContent='Still processing photos \u2014 please wait a moment.';return;}
  var name=document.getElementById('f-name').value.trim();
  var species=document.getElementById('f-species').value.trim();
  if(!name && !species){document.getElementById('f-err').textContent='Please enter a name or species.';return;}
  var spec={
    name:name,species:species,
    formula:document.getElementById('f-formula').value.trim(),
    form:document.getElementById('f-form').value.trim(),
    mine:document.getElementById('f-mine').value.trim(),
    region:document.getElementById('f-region').value.trim(),
    country:document.getElementById('f-country').value.trim(),
    dealer:document.getElementById('f-dealer').value.trim(),
    excoll:document.getElementById('f-excoll').value.trim(),
    dims:document.getElementById('f-dims').value.trim(),
    uvLow:document.getElementById('f-uv-low').value.trim(),
    uvMed:document.getElementById('f-uv-med').value.trim(),
    uvHigh:document.getElementById('f-uv-high').value.trim(),
    notes:document.getElementById('f-notes').value.trim(),
    coverPosition:formCoverPosition
  };
  if(editId!==null){
    spec.id=editId;
    spec.photoIds=originalPhotoIds; // placeholder; corrected below once photo IO settles
  }

  saveSpecimen(spec,function(newId){
    var id=editId!==null?editId:newId;

    // figure out which existing photos were removed in the form, and which
    // entries are brand-new uploads that still need a real id + save
    var keptIds=formPhotos.filter(function(p){return !p.isNew;}).map(function(p){return p.id;});
    var removedIds=originalPhotoIds.filter(function(pid){return keptIds.indexOf(pid)===-1;});
    var newOnes=formPhotos.filter(function(p){return p.isNew;});

    var finalPhotoIds=[];
    var remaining=formPhotos.length;
    var afterEach=function(){
      remaining--;
      if(remaining>0)return;
      deletePhotosByIds(removedIds,function(){
        spec.photoIds=finalPhotoIds;
        spec.id=id;
        saveSpecimen(spec,function(){
          afterSaveSuccess(editId!==null);
        });
      });
    };

    if(!formPhotos.length){
      deletePhotosByIds(removedIds,function(){
        spec.photoIds=[];
        spec.id=id;
        saveSpecimen(spec,function(){
          afterSaveSuccess(editId!==null);
        });
      });
      return;
    }

    formPhotos.forEach(function(p,i){
      if(p.isNew){
        var pid=id+'_'+Date.now()+'_'+i;
        savePhotoWithId(pid,p.data,function(){
          finalPhotoIds[i]=pid;
          afterEach();
        });
      }else{
        finalPhotoIds[i]=p.id;
        afterEach();
      }
    });
  });
}

// ---------------- wiring ----------------
document.getElementById('rs-add-btn').onclick=openAddForm;
document.getElementById('f-cancel').onclick=closeForm;
document.getElementById('f-save').onclick=trySave;
document.getElementById('rs-detail-close').onclick=closeDetail;
document.getElementById('rs-lightbox-close').onclick=closeLightbox;
document.getElementById('rs-lightbox').onclick=function(ev){if(ev.target===this)closeLightbox();};
document.getElementById('rs-detail-modal').onclick=function(ev){if(ev.target===this)closeDetail();};
document.getElementById('rs-form-modal').onclick=function(ev){if(ev.target===this)closeForm();};
document.getElementById('rs-detail-edit').onclick=function(){
  var id=parseInt(document.getElementById('rs-detail-modal').dataset.id,10);
  closeDetail();openEditForm(id);
};
document.getElementById('rs-detail-del').onclick=function(){
  var id=parseInt(document.getElementById('rs-detail-modal').dataset.id,10);
  if(!confirm('Remove this specimen from the Reserve? This cannot be undone.'))return;
  deleteSpecimen(id,function(){
    closeDetail();
    loadAll(function(){render();flash('Specimen removed');});
  });
};
document.getElementById('f-photo-btn').onclick=function(){document.getElementById('f-photo').click();};

// ---------------- cover photo position adjuster ----------------
function setPositionMarker(pos){
  var parts=pos.split(' ');
  var xPct=parseFloat(parts[0])||50, yPct=parseFloat(parts[1])||50;
  var marker=document.getElementById('rs-position-marker');
  marker.style.left=xPct+'%';
  marker.style.top=yPct+'%';
  document.getElementById('rs-position-preview-img').style.objectPosition=pos;
}
document.getElementById('f-adjust-position').onclick=function(){
  if(!formPhotos.length)return;
  var coverData=formPhotos[0].data;
  document.getElementById('rs-position-img').src=coverData;
  document.getElementById('rs-position-preview-img').src=coverData;
  setPositionMarker(formCoverPosition);
  document.getElementById('rs-position-modal').classList.add('open');
};
document.getElementById('rs-position-frame').onclick=function(ev){
  var rect=this.getBoundingClientRect();
  var xPct=Math.round(((ev.clientX-rect.left)/rect.width)*100);
  var yPct=Math.round(((ev.clientY-rect.top)/rect.height)*100);
  xPct=Math.max(0,Math.min(100,xPct));
  yPct=Math.max(0,Math.min(100,yPct));
  formCoverPosition=xPct+'% '+yPct+'%';
  setPositionMarker(formCoverPosition);
};
document.getElementById('rs-position-reset').onclick=function(){
  formCoverPosition='50% 50%';
  setPositionMarker(formCoverPosition);
};
document.getElementById('rs-position-done').onclick=function(){
  document.getElementById('rs-position-modal').classList.remove('open');
};
document.getElementById('rs-position-modal').onclick=function(ev){if(ev.target===this)this.classList.remove('open');};
document.getElementById('f-photo').onchange=function(){
  var files=Array.prototype.slice.call(this.files);
  this.value='';
  if(!files.length)return;
  pendingPhotoJobs+=files.length;
  updateSaveBusyState();
  files.forEach(function(file){
    compressPhoto(file,function(dataURL){
      if(dataURL)formPhotos.push({id:null,data:dataURL,isNew:true});
      pendingPhotoJobs--;
      updateSaveBusyState();
      renderPhotoStrip();
    });
  });
};
document.getElementById('rs-search').oninput=render;
document.querySelectorAll('.rs-tab').forEach(function(tab){
  tab.onclick=function(){
    currentTab=this.dataset.tab;
    document.querySelectorAll('.rs-tab').forEach(function(t){t.classList.remove('active');});
    this.classList.add('active');
    render();
  };
});
document.getElementById('rs-sort').onchange=render;

// ---------------- boot ----------------
openDB(function(){
  loadAll(function(){render();});
});

})();
</script>
